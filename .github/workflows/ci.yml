name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, tests and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never has a Qloo key: everything runs on fixtures.
      WALKUP_MODE: fixture
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Skill and tag-config checks
        run: node --test "skills/test/*.test.mjs" "config/test/*.test.mjs"

      - name: No raw Qloo response bodies in the tree
        run: node scripts/check-no-raw.mjs

      - name: Build the web app
        run: cd apps/web && npx next build

  evals:
    name: Evals (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install eval dependencies
        run: python -m pip install -r evals/requirements.txt

      # pytest when it is installed; otherwise each test module's own runner
      # (every evals/*/test_*.py exits non-zero on a failure). A failing pytest
      # run is never retried with a smaller subset.
      - name: Eval tests (fixtures only)
        run: |
          if python -c "import pytest" 2>/dev/null; then
            python -m pytest evals
          else
            status=0
            for t in evals/*/test_*.py; do
              echo "== $t"
              python "$t" || status=1
            done
            exit "$status"
          fi

      - name: Gazetteer build tests (offline)
        run: python data/gazetteer/test_build.py

  product-score:
    # Definition of done D7: re-run the 20-case product eval on fixtures and commit the score file when the
    # result (not just its timestamp) changed. Pushes to the default branch only; the commit skips CI.
    name: Product eval score (fixtures)
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      WALKUP_MODE: fixture
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Product eval (fixtures)
        run: npx tsx evals/product/run.ts --quiet

      - name: Commit the score file when anything but its timestamp changed
        run: |
          if git diff --quiet -I '"generatedAt"' -I '^Generated: ' -- evals/product/out; then
            echo "Score unchanged apart from its timestamp; nothing to commit."
            git checkout -- evals/product/out
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/product/out/score.json evals/product/out/score.md
          git commit -m "Product eval score [skip ci]"
          git push
