server {
  listen 8080;
  root /usr/share/nginx/html;
  charset utf-8;
  add_header X-Robots-Tag "noindex" always;
  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  location ~ ^/api/sheet/[^/]+/pdf$ { default_type application/pdf; add_header Content-Disposition "inline; filename=street-sheet.pdf"; }
  location ~ \.ics$ { default_type text/calendar; }
  location ~ \.csv$ { default_type text/csv; }
  location ~ ^/api/sheet/[^/]+/ics$ { default_type text/calendar; add_header Content-Disposition "attachment; filename=street-team.ics"; }
  location /_next/static/ { expires 30d; }
  location / { try_files $uri $uri/index.html =404; }
  error_page 404 /404.html;
}
